[project]
name = "olx-hunter-backend"
version = "0.1.0"
description = "Backend for the OLX Hunter Telegram Mini App"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiogram>=3.22,<4",
  "alembic>=1.17,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.119,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "orjson>=3.10,<4",
  "pillow>=11.3,<13",
  "pydantic-settings>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "selectolax>=0.3.35,<1",
  "sqlalchemy[asyncio]>=2.0.44,<3",
  "uvicorn[standard]>=0.37,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
